name: AgentSight Kernel Compatibility

on:
  push:
    branches:
      - main
      - 'release/**'
      - chore/agentsight-runner-pools
    paths:
      - 'src/agentsight/**'
      - '.github/workflows/agentsight-kernel-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup

concurrency:
  group: agentsight-kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bpf-load:
    name: eBPF load (kernel ${{ matrix.kernel }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: '5.10'
            runner: anolisa-agentsight-kernel510-x64
          - kernel: '5.15'
            runner: anolisa-agentsight-kernel515-x64
          - kernel: '6.6'
            runner: anolisa-agentsight-kernel66-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify kernel and runner isolation
        shell: bash
        env:
          EXPECTED_KERNEL: ${{ matrix.kernel }}
        run: |
          set -euo pipefail
          actual_kernel=$(uname -r)
          case "$actual_kernel" in
            "$EXPECTED_KERNEL".*) ;;
            *)
              echo "Expected kernel ${EXPECTED_KERNEL}.x, got ${actual_kernel}" >&2
              exit 1
              ;;
          esac

          sudo -n true
          sudo test -r /sys/kernel/btf/vmlinux
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
          echo "Testing kernel ${actual_kernel}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89.0'

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libbpf-dev libelf-dev elfutils libssl-dev \
            zlib1g-dev pkg-config perl

      - name: Load all eBPF probes
        shell: bash
        run: |
          set -euo pipefail
          cd src/agentsight
          cargo_bin=$(command -v cargo)
          sudo env \
            HOME="$HOME" \
            CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
            RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" \
            PATH="$PATH" \
            "$cargo_bin" test --test bpf_load -- --ignored
