name: sec-core-source-code-build

on:
  pull_request:
    branches:
      - main
      - 'release/agent-sec-core/**'
    paths:
      - 'src/agent-sec-core/**'
      - 'scripts/build-all.sh'
      - '.github/workflows/sec-core-source-code-build.yaml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            container: ''
          - name: Alinux4
            container: alibaba-cloud-linux-4-registry.cn-hangzhou.cr.aliyuncs.com/alinux4/alinux4:latest
    name: Source Build (${{ matrix.name }})
    runs-on: anolisa-k8s-general-ci-x64
    container: ${{ matrix.container || '' }}
    steps:
      - name: Configure mirrors and install base tools (Alinux4)
        if: matrix.container != ''
        env:
          USE_VPC_MIRROR: "true"
        shell: bash
        run: |
          set -euo pipefail

          configure_repo_host() {
            local host="$1"
            sed -i \
              -e "s#mirrors\.cloud\.aliyuncs\.com#${host}#g" \
              -e "s#mirrors\.aliyun\.com#${host}#g" \
              /etc/yum.repos.d/*.repo
            dnf clean all
          }

          import_alinux_gpg_key() {
            local host="$1"
            local key_url="http://${host}/alinux/4/RPM-GPG-KEY-ALINUX-4"
            echo "Importing Alinux GPG key from ${key_url}"
            curl -fsSL --connect-timeout 10 --max-time 60 -o /tmp/RPM-GPG-KEY-ALINUX-4 "${key_url}"
            rpm --import /tmp/RPM-GPG-KEY-ALINUX-4
          }

          configure_alinux_mirror() {
            if [ "${USE_VPC_MIRROR:-false}" = "true" ]; then
              for attempt in 1 2; do
                echo "Trying VPC Alinux mirror (${attempt}/2)"
                configure_repo_host mirrors.cloud.aliyuncs.com
                if import_alinux_gpg_key mirrors.cloud.aliyuncs.com; then
                  return 0
                fi
                sleep 2
              done
              echo "VPC Alinux mirror failed; falling back to public mirror"
            else
              echo "Using public Alinux mirror"
            fi

            configure_repo_host mirrors.aliyun.com
            import_alinux_gpg_key mirrors.aliyun.com
          }

          dnf_install() {
            dnf --setopt=timeout=120 --setopt=retries=5 --setopt=minrate=1 install -y "$@"
          }

          configure_alinux_mirror
          dnf_install tar git sudo
          # Fix sudo PAM in container: replace with permissive config
          cat > /etc/pam.d/sudo <<'EOF'
          #%PAM-1.0
          auth       sufficient   pam_rootok.so
          account    sufficient   pam_permit.so
          session    sufficient   pam_permit.so
          EOF
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy, rustfmt, rust-src
      - name: Build and install
        run: |
          ./scripts/build-all.sh --component sec-core
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify CLI
        run: |
          agent-sec-cli --version
          agent-sec-cli --help
      - name: Verify daemon
        run: agent-sec-daemon --help
      - name: Verify sandbox
        run: linux-sandbox --help
      - name: Verify deployment
        run: |
          echo "=== Skills ==="
          ls ~/.copilot-shell/skills/
          echo "=== Cosh Extension ==="
          ls ~/.copilot-shell/extensions/agent-sec-core/
          ls ~/.copilot-shell/extensions/agent-sec-core/hooks/
          echo "=== OpenClaw Plugin ==="
          ls ~/.local/lib/anolisa/sec-core/openclaw-plugin/
          ls ~/.local/lib/anolisa/sec-core/openclaw-plugin/dist/
          ls ~/.local/lib/anolisa/sec-core/openclaw-plugin/scripts/
          test -x ~/.local/lib/anolisa/sec-core/openclaw-plugin/scripts/deploy.sh
          echo "=== Hermes Plugin ==="
          ls ~/.local/lib/anolisa/sec-core/hermes-plugin/src/
          ls ~/.local/lib/anolisa/sec-core/hermes-plugin/src/plugin.yaml
          ls ~/.local/lib/anolisa/sec-core/hermes-plugin/scripts/deploy.sh
          test -x ~/.local/lib/anolisa/sec-core/hermes-plugin/scripts/deploy.sh
          echo "=== Codex Plugin ==="
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/hooks-plugin/hooks/
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/hooks-plugin/hooks/code_scanner_hook.py
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/hooks-plugin/hooks/skill_ledger_hook.py
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/hooks-plugin/.codex-plugin/plugin.json
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/install.sh
          test -x ~/.local/lib/anolisa/sec-core/codex-plugin/install.sh
          ls ~/.local/lib/anolisa/sec-core/codex-plugin/.agents/plugins/marketplace.json
          echo "=== CLI venv ==="
          ls ~/.local/lib/anolisa/sec-core/venv/bin/agent-sec-cli
      - name: Run E2E tests
        run: make -C src/agent-sec-core test-e2e-source-build
