[component]
name = "tokenless"
version = "0.7.2"
layer = "runtime"
domain = "optimization"
display_name = "Tokenless"
description = "LLM token optimization toolkit - schema/response compression, command rewriting"
owner = "tokenless-team"
license = "MIT"
repository = "https://github.com/alibaba/anolisa"

[component.contract]
schema_version = "1.0"
min_anolisa_version = "0.1.16"

[component.platform]
# min_kernel is intentionally omitted: tokenless has no kernel capability
# dependency, and the schema would apply the constraint to Linux and macOS.
os = ["linux", "macos"]
arch = ["x86_64", "aarch64"]

[[component.dependencies]]
name = "python3"
kind = "system-package"
probe = "python3 --version"
packages = { rpm = "python3", deb = "python3" }

[[component.dependencies]]
name = "bash"
kind = "system-package"
probe = "bash --version"
packages = { rpm = "bash", deb = "bash" }

[component.layout]
modes = ["user", "system"]

[[component.layout.files]]
source = ".anolisa/component.toml"
target = "{datadir}/components/tokenless/component.toml"
mode = "0644"

[[component.layout.files]]
source = "bin/tokenless"
target = "{bindir}/tokenless"
mode = "0755"
type = "executable"

[[component.layout.files]]
source = "libexec/anolisa/tokenless/rtk"
target = "{libexecdir}/tokenless/rtk"
mode = "0755"
type = "executable"

[[component.layout.files]]
source = "libexec/anolisa/tokenless/toon"
target = "{libexecdir}/tokenless/toon"
mode = "0755"
type = "executable"

[[component.layout.files]]
source = "{libexecdir}/tokenless/rtk"
target = "{bindir}/rtk"
type = "symlink"

[[component.layout.files]]
source = "{libexecdir}/tokenless/toon"
target = "{bindir}/toon"
type = "symlink"

# Shared assets use explicit rows because the archive mixes executable hooks
# and data files; a directory-wide mode would either break hooks or overgrant
# execute permission. Cosh uses its separately staged extension bundle.
[[component.layout.files]]
source = "adapters/common/commands/tokenless-stats.toml"
target = "{datadir}/adapters/{component}/common/commands/tokenless-stats.toml"
mode = "0644"

[[component.layout.files]]
source = "adapters/common/cosh-extension.json"
target = "{datadir}/adapters/{component}/common/cosh-extension.json"
mode = "0644"

[[component.layout.files]]
source = "adapters/common/hooks/compress_response_hook.py"
target = "{datadir}/adapters/{component}/common/hooks/compress_response_hook.py"
mode = "0755"

[[component.layout.files]]
source = "adapters/common/hooks/compress_schema_hook.py"
target = "{datadir}/adapters/{component}/common/hooks/compress_schema_hook.py"
mode = "0755"

[[component.layout.files]]
source = "adapters/common/hooks/compress_toon_hook.py"
target = "{datadir}/adapters/{component}/common/hooks/compress_toon_hook.py"
mode = "0755"

[[component.layout.files]]
source = "adapters/common/hooks/hook_utils.py"
target = "{datadir}/adapters/{component}/common/hooks/hook_utils.py"
mode = "0755"

[[component.layout.files]]
source = "adapters/common/hooks/rewrite_hook.py"
target = "{datadir}/adapters/{component}/common/hooks/rewrite_hook.py"
mode = "0755"

[[component.layout.files]]
source = "adapters/common/hooks/run-hook.sh"
target = "{datadir}/adapters/{component}/common/hooks/run-hook.sh"
mode = "0755"

[[component.layout.files]]
source = "adapters/common/hooks/tool_categories.json"
target = "{datadir}/adapters/{component}/common/hooks/tool_categories.json"
mode = "0644"

[[component.layout.files]]
source = "adapters/common/hooks/tool_ready_hook.sh"
target = "{datadir}/adapters/{component}/common/hooks/tool_ready_hook.sh"
mode = "0755"

[[component.layout.files]]
source = "adapters/common/tokenless-env-fix.sh"
target = "{datadir}/adapters/{component}/common/tokenless-env-fix.sh"
mode = "0755"

[[component.layout.files]]
source = "adapters/common/tool-ready-spec.json"
target = "{datadir}/adapters/{component}/common/tool-ready-spec.json"
mode = "0644"

[component.health_check]
type = "binary_version"
binary = "{bindir}/tokenless"
timeout_secs = 5

[[adapters]]
framework = "openclaw"
kind = "third-party"
adapter_type = "plugin"
plugin_id = "tokenless"
source = "adapters/openclaw"
dest = "{datadir}/adapters/{component}/openclaw/"
detect = { binary = "openclaw" }

[adapters.bundle]
entry = "openclaw.plugin.json"

[[adapters]]
framework = "hermes"
kind = "third-party"
adapter_type = "plugin"
plugin_id = "tokenless"
source = "adapters/hermes"
dest = "{datadir}/adapters/{component}/hermes/"
detect = { binary = "hermes" }

[adapters.bundle]
entry = "plugin.yaml"

[[adapters]]
framework = "qoder"
adapter_type = "plugin"
plugin_id = "tokenless"
source = "adapters/qoder"
dest = "{datadir}/adapters/{component}/qoder/"

[adapters.bundle]
# Qoder-native plugin manifest inside the bundle directory. The built-in
# qoder driver reads this to confirm the bundle is a valid Qoder plugin and
# requires hooks.json beside it. The legacy scripts/install.sh and
# uninstall.sh ship in the same bundle as publishing assets, but the ANOLISA
# driver never invokes them — enable/disable behavior is built into Rust.
entry = ".qoder-plugin/plugin.json"

[[adapters]]
framework = "claude-code"
adapter_type = "plugin"
plugin_id = "tokenless"
source = "adapters/claude-code"
dest = "{datadir}/adapters/{component}/claude-code/"

[adapters.bundle]
entry = ".claude-plugin/marketplace.json"

[[adapters]]
framework = "codex"
adapter_type = "plugin"
plugin_id = "tokenless"
source = "adapters/codex"
dest = "{datadir}/adapters/{component}/codex/"

[adapters.bundle]
entry = ".codex-plugin/plugin.json"

[[adapters]]
framework = "cosh"
adapter_type = "extension"
plugin_id = "tokenless"
source = "extensions/tokenless"
dest = "{datadir}/extensions/{component}/"

[adapters.bundle]
entry = "cosh-extension.json"

# Qwencode extension adapter. Coexists independently with the other
# adapters above — each adapter is scoped to its own framework driver,
# and the anolisa CLI selects exactly one framework per session based on
# the active agent runtime. Enabling qwencode has no effect on openclaw,
# hermes, qoder, claude-code, codex, or cosh adapters. The qwencode
# driver loads this extension only when the framework is qwencode.
[[adapters]]
framework = "qwencode"
adapter_type = "extension"
plugin_id = "tokenless"
source = "adapters/qwencode"
dest = "{datadir}/adapters/{component}/qwencode/"

[adapters.bundle]
entry = "qwen-extension.json"
