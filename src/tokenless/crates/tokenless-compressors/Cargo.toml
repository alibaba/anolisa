[package]
name = "tokenless-compressors"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compressor engines for tokenless content compression"

[dependencies]
# Stash trait + key + marker only — no SQLite backend here. The runtime
# supplies the concrete backend, so this crate stays free of rusqlite.
tokenless-ccr = { path = "../tokenless-ccr", default-features = false }
